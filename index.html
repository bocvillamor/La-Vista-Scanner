<!doctype html>
<html lang="en">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>La Vista Gate Scanner</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #10213a;
      --muted: #627087;
      --blue: #1477ef;
      --border: #d7e0eb;
      --bg: #eef3f9;
      --entry-bg: #e8f8ed;
      --entry-border: #a9dfb9;
      --entry-ink: #15652e;
      --exit-bg: #fff0f0;
      --exit-border: #efb8b8;
      --exit-ink: #9a2424;
      --error-bg: #fff0ee;
      --error-ink: #a22a20;
      --success-bg: #eaf8ef;
      --success-ink: #176a32;
    }

    * { box-sizing: border-box; }
    [hidden] { display:none !important; }
    #idVideo, #photoPreview { width:100%; max-height:65vh; object-fit:contain; border-radius:14px; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: linear-gradient(145deg, #f5f8fc 0%, #eaf1f8 100%);
    }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 24px 18px 40px;
    }

    .eyebrow {
      color: #086bdc;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.18em;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 52px);
      line-height: 1.04;
    }

    .subtitle {
      margin: 10px 0 22px;
      color: var(--muted);
      font-size: 20px;
    }

    .mode {
      padding: 22px 24px;
      border: 1px solid var(--entry-border);
      border-radius: 20px;
      background: var(--entry-bg);
      color: var(--entry-ink);
      margin-bottom: 20px;
    }

    .mode.exit {
      border-color: var(--exit-border);
      background: var(--exit-bg);
      color: var(--exit-ink);
    }

    .mode .label {
      display: block;
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .mode .station {
      display: block;
      font-size: 24px;
      font-weight: 800;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 18px 45px rgba(41, 61, 89, 0.10);
    }

    #reader {
      width: 100%;
      min-height: 360px;
      overflow: hidden;
      border: 2px dashed #cad5e2;
      border-radius: 20px;
      background: #f9fbfd;
    }

    #reader video {
      border-radius: 16px;
    }

    .message {
      display: none;
      margin-bottom: 16px;
      padding: 15px 16px;
      border-radius: 14px;
      font-size: 17px;
      line-height: 1.45;
    }

    .message.show { display: block; }
    .message.error { background: var(--error-bg); color: var(--error-ink); }
    .message.success { background: var(--success-bg); color: var(--success-ink); }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      width: 100%;
      min-height: 58px;
      border-radius: 14px;
      border: 1px solid #cfd9e6;
      font: inherit;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    .secondary {
      background: #fff;
      color: var(--ink);
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .small-note {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      margin-top: 14px;
    }

    @media (max-width: 520px) {
      .app { padding: 18px 12px 28px; }
      .card { padding: 14px; border-radius: 20px; }
      #reader { min-height: 320px; }
      .mode { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="eyebrow">LA VISTA SECURITY</div>
    <h1 id="title">Gate Scanner</h1>
    <p id="subtitle" class="subtitle">Camera terminal</p>

    <div id="message" class="message" role="alert"></div>

    <section id="mode" class="mode">
      <span id="modeLabel" class="label">ENTRY SCAN</span>
      <span id="stationLabel" class="station">Gate</span>
    </section>

    <section class="card">
      <div id="scanControls" hidden>
      <div id="reader"></div>

      <div class="actions">
        <button id="startButton" class="primary" type="button">Start camera</button>
        <button id="stopButton" class="secondary" type="button" disabled>Stop camera</button>
      </div>

      </div>
      <section id="photoPanel" hidden>
        <h2 id="photoTitle">Take Photo of Driver’s ID</h2>
        <p id="photoScanLabel"></p>
        <p id="photoInstructions"></p>
        <video id="idVideo" playsinline muted hidden></video>
        <img id="photoPreview" alt="Driver ID photo preview" hidden>
        <div class="actions">
          <button id="takePhotoButton" class="primary" type="button">Take Photo of Driver’s ID</button>
          <button id="capturePhotoButton" class="primary" type="button" hidden>Capture Photo</button>
          <button id="retakePhotoButton" class="secondary" type="button" hidden>Retake Photo</button>
          <button id="uploadPhotoButton" class="primary" type="button" hidden disabled>Save ID photo and complete admission</button>
        </div>
      </section>
      <div class="actions">
        <button id="retryButton" class="primary" type="button" hidden>Retry same request</button>

        <button id="backButton" class="secondary" type="button">Check current request</button>
      </div>

      <p class="small-note" id="workflowNote">
        QR validation and admission records remain in La Vista. Check the current request before starting another admission.
      </p>
    </section>
  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const STATE = {scanner:null,stream:null,busy:false,phase:'connecting',
      handoff:'',endpoint:'',requestId:'',mode:'',direction:'ENTRY',stationName:'',
      qrText:'',photo:null,timeout:null,expiresAt:0};
    const STORAGE_KEY='laVistaScannerForegroundV1';
    document.addEventListener('DOMContentLoaded',init);
    function init() {
      try {
        const fragment=location.hash.slice(1);
        const data=fragment?Object.fromEntries(new URLSearchParams(fragment)):JSON.parse(sessionStorage.getItem(STORAGE_KEY)||'null');
        if(!data || !/^[A-Za-z0-9_-]{40,120}$/.test(data.handoff || '') ||
          !/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(data.endpoint || '') ||
          !/^[a-zA-Z0-9_-]{20,100}$/.test(data.requestId || '') || Date.now()>=Number(data.expiresAt || 0)) throw Error('Scanner session is missing or expired. Reopen from La Vista.');
        Object.assign(STATE,{handoff:data.handoff,endpoint:data.endpoint,requestId:data.requestId,
          mode:data.mode,photoOptional:data.photoOptional==='1',direction:data.direction,stationName:data.stationName,expiresAt:Number(data.expiresAt),qrText:data.qrText || ''});
        persistRequest();history.replaceState(null,'',location.pathname + location.search);
        document.getElementById('title').textContent=STATE.direction==='EXIT'?'Exit Scanner':'Entry Scanner';
        document.getElementById('stationLabel').textContent=STATE.stationName;
        document.getElementById('subtitle').textContent=data.liveAdmin==='1'?'Super Admin — LIVE admissions':STATE.stationName;
        document.getElementById('modeLabel').textContent=STATE.direction+' SCAN';
        document.getElementById('mode').classList.toggle('exit',STATE.direction==='EXIT');
        document.getElementById('startButton').onclick=startCamera;
        document.getElementById('stopButton').onclick=stopCamera;
        document.getElementById('takePhotoButton').onclick=startIdCamera;
        document.getElementById('capturePhotoButton').onclick=captureIdPhoto;
        document.getElementById('retakePhotoButton').onclick=function(){if(!STATE.busy){STATE.photo=null;startIdCamera();}};
        document.getElementById('uploadPhotoButton').onclick=uploadPhoto;
        document.getElementById('retryButton').onclick=retry;
        document.getElementById('backButton').onclick=function(){submitForeground('resume');};
        window.addEventListener('pagehide',stopAll);
        window.addEventListener('pageshow',function(e){if(e.persisted){STATE.busy=false;document.getElementById('retryButton').hidden=false;showMessage(photoFailureMessage('Check or retry this same request. Do not start another admission until confirmed.'),true);}});
        document.getElementById('scanControls').hidden=STATE.mode!=='scan' || Boolean(STATE.qrText);
        document.getElementById('photoPanel').hidden=STATE.mode!=='photo';
        if(STATE.mode==='photo') {renderPhotoInstructions();STATE.phase='photo';setPhotoControls('start');document.getElementById('photoScanLabel').textContent='Admission request: '+STATE.requestId;showMessage(STATE.photoOptional?'Admission is already recorded. You may attach an optional ID photo or return without one.':'This legacy admission still requires a driver ID photo to complete it.',false);}
        else if(STATE.mode==='scan' && !STATE.qrText) {STATE.phase='ready';showMessage('Ready. Tap Start camera.',false);}
        else {STATE.phase='validating';document.getElementById('retryButton').hidden=false;showMessage('Check or retry the current request.',false);}
      } catch(error) {sessionStorage.removeItem(STORAGE_KEY);STATE.phase='closed';document.getElementById('scanControls').hidden=true;showMessage(readableError(error),true);}
    }
    function renderPhotoInstructions() {
      const title='Take Photo of Driver’s ID'+(STATE.photoOptional?' (Optional)':'');
      document.getElementById('photoTitle').textContent=title;
      document.getElementById('takePhotoButton').textContent=title;
      document.getElementById('photoInstructions').textContent=STATE.photoOptional
        ? 'Admission is already recorded. This photo is optional and will be stored privately for 60 days.'
        : 'Required for this legacy pending Event admission. The photo is stored privately for 60 days.';
      document.getElementById('uploadPhotoButton').textContent=STATE.photoOptional?'Save optional ID photo':'Save ID photo and complete admission';
      document.getElementById('workflowNote').textContent=STATE.photoOptional
        ? 'Leaving without a photo does not affect the recorded admission. Check current request to return to the result.'
        : 'Closing before saving leaves this legacy admission incomplete; reopen it from the dashboard to resume.';
    }
    function photoFailureMessage(message) {
      return STATE.mode==='photo' && STATE.photoOptional
        ? 'Admission is already recorded. Only the optional photo was not confirmed. '+message : message;
    }
    function persistRequest() {
      // Short-lived scanner capability + pending QR only; never app token or ID photo.
      sessionStorage.setItem(STORAGE_KEY,JSON.stringify({handoff:STATE.handoff,endpoint:STATE.endpoint,
        requestId:STATE.requestId,mode:STATE.mode,photoOptional:STATE.photoOptional?'1':'0',direction:STATE.direction,stationName:STATE.stationName,
        expiresAt:STATE.expiresAt,qrText:STATE.qrText}));
    }
    function submitForeground(action,extra) {
      if(STATE.busy || STATE.phase==='closed') return;
      if(Date.now()>=STATE.expiresAt){showMessage(STATE.mode==='photo' && STATE.photoOptional?'Admission is already recorded. The optional-photo session expired; return to La Vista.':'Scanner session expired. Reopen from La Vista and review the pending admission.',true);return;}
      // Normal top-level form navigation: no CORS, fetch, iframe relay or opener.
      const form=document.createElement('form');form.method='POST';form.action=STATE.endpoint;form.target='_self';
      const fields=Object.assign({handoff:STATE.handoff,requestId:STATE.requestId,scanAction:action},extra || {});
      Object.keys(fields).forEach(function(name){const input=document.createElement('input');input.type='hidden';input.name=name;input.value=fields[name];form.appendChild(input);});
      document.body.appendChild(form);STATE.busy=true;
      document.getElementById('retryButton').hidden=true;
      clearTimeout(STATE.timeout);STATE.timeout=setTimeout(function(){STATE.busy=false;document.getElementById('retryButton').hidden=false;showMessage(photoFailureMessage('Navigation was not confirmed. Retry the same request or Check current request; do not admit again.'),true);},45000);
      showMessage(action==='photo'?'Saving ID photo in La Vista…':'Opening La Vista to confirm this request…',false);
      try {form.submit();} catch(error){STATE.busy=false;document.getElementById('retryButton').hidden=false;showMessage(photoFailureMessage('Submission could not start. Retry the same request. '+readableError(error)),true);} finally {form.remove();}
    }
    function startCamera() {
      if (STATE.phase!=='ready' || STATE.busy || STATE.scanner) return;
      if (typeof Html5Qrcode==='undefined') { showMessage('QR library did not load. Check your connection.',true); return; }
      const scanner=new Html5Qrcode('reader'); STATE.scanner=scanner;
      document.getElementById('startButton').disabled=true;
      document.getElementById('stopButton').disabled=false;
      scanner.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.floor(Math.min(w,h)*.72),height:Math.floor(Math.min(w,h)*.72)})},function (text) {
        if (STATE.busy || STATE.phase!=='ready') return;
        STATE.busy=true;
        stopCamera().then(()=>submitQr(text));
      },function(){}).catch(function(error) {
        STATE.scanner=null; document.getElementById('startButton').disabled=false;
        document.getElementById('stopButton').disabled=true; showMessage('Camera unavailable. Allow camera access and try again. ' + readableError(error),true);
      });
    }
    function stopCamera() {
      const s=STATE.scanner; STATE.scanner=null;
      document.getElementById('startButton').disabled=false;
      document.getElementById('stopButton').disabled=true;
      if (!s) return Promise.resolve();
      return s.stop().catch(()=>{}).then(()=>{try{s.clear();}catch(ignore){}});
    }
    function submitQr(text) {
      if(STATE.phase!=='ready') return;
      STATE.busy=false;STATE.qrText=String(text || '').trim();STATE.phase='validating';persistRequest();
      document.getElementById('scanControls').hidden=true;retry();
    }
    function retry() {
      if(STATE.busy || STATE.phase==='closed')return;
      if(STATE.mode==='photo' && STATE.photo){uploadPhoto();return;}
      if(STATE.qrText)submitForeground('scan',{qrPayload:STATE.qrText});
      else submitForeground('resume');
    }
    async function startIdCamera() {
      if (STATE.phase!=='photo' || STATE.busy) return;
      if (STATE.photoStarting) return;
      STATE.photoStarting=true;STATE.photo=null;
      stopIdCamera();setPhotoControls('starting');
      document.getElementById('photoPreview').hidden=true;
      document.getElementById('uploadPhotoButton').disabled=true;
      try {
        const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
        if (STATE.phase!=='photo') { stream.getTracks().forEach(t=>t.stop()); return; }
        STATE.stream=stream;
        const video=document.getElementById('idVideo'); video.hidden=false; video.srcObject=stream; await video.play();
        setPhotoControls('running');
        showMessage('Frame the driver’s ID clearly, then capture the photo.',false);
      } catch(error) { stopIdCamera();setPhotoControls('start'); showMessage(photoFailureMessage((STATE.photoOptional?'Allow camera access to take the optional photo, or return without it. ':'ID photo is required. Allow camera access and try again. ') + readableError(error)),true); } finally {STATE.photoStarting=false;}
    }
    function setPhotoControls(stage) {
      document.getElementById('takePhotoButton').hidden=stage!=='start';
      document.getElementById('capturePhotoButton').hidden=stage!=='running';
      document.getElementById('retakePhotoButton').hidden=stage!=='captured';
      document.getElementById('uploadPhotoButton').hidden=stage!=='captured';
    }
    function captureIdPhoto() {
      const video=document.getElementById('idVideo');
      if (STATE.busy || !STATE.stream || !video.videoWidth || STATE.phase!=='photo') return;
      const canvas=document.createElement('canvas');
      const scale=Math.min(1,1600/Math.max(video.videoWidth,video.videoHeight));
      canvas.width=Math.round(video.videoWidth*scale); canvas.height=Math.round(video.videoHeight*scale);
      canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
      STATE.photo=canvas.toDataURL('image/jpeg',.88);
      stopIdCamera();
      const preview=document.getElementById('photoPreview');preview.src=STATE.photo;preview.hidden=false;
      setPhotoControls('captured');
      document.getElementById('uploadPhotoButton').disabled=false;
      showMessage('Review the photo. Make sure the ID is readable before saving.',false);
    }
    function uploadPhoto() {
      if(STATE.busy || STATE.phase!=='photo' || !STATE.photo)return;
      document.getElementById('uploadPhotoButton').disabled=true;
      submitForeground('photo',{photoBase64:STATE.photo.split(',')[1]});
    }
    function stopIdCamera() {
      if (STATE.stream) STATE.stream.getTracks().forEach(t=>t.stop()); STATE.stream=null;
      const video=document.getElementById('idVideo');video.srcObject=null;video.hidden=true;
      document.getElementById('capturePhotoButton').hidden=true;
    }
    function stopAll() { stopCamera(); stopIdCamera(); clearTimeout(STATE.timeout); }
    function showMessage(text,error) { const el=document.getElementById('message');el.textContent=String(text||'');el.className='message show ' + (error?'error':'success'); }
    function readableError(error) { return String(error && (error.message||error.name) || error || ''); }
  </script>

</body>
</html>
